version: 2

multi-ecosystem-groups:
  global-updates:
    schedule:
      interval: "cron"
      cronjob: "15 1 * * 0"  # All ecosystems now run at 1:15 AM
    ecosystems:
      - "github-actions"
      - "pip"
      - "uv"
      - "terraform"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[GITHUB-ACTIONS] "
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    versioning-strategy: "increase"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[PIP] "
    groups:
      pip-all:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    versioning-strategy: "increase"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "[UV] "
    groups:
      uv-all:
        patterns:
          - "*"
    cooldown:
      default-days: 3