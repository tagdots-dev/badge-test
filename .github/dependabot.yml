version: 2

multi-ecosystem-groups:
  project-updates:
    schedule:
      interval: "cron"
      cronjob: "15 1 * * 0"
    commit-message:
      prefix: "[DEPS] "
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "disabled"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    multi-ecosystem-group: "project-updates"
    patterns:
      - "*"
    cooldown:
      default-days: 3
  - package-ecosystem: "uv"
    directory: "/"
    multi-ecosystem-group: "project-updates"
    rebase-strategy: "disabled"
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    patterns:
      - "*"
    cooldown:
      default-days: 3
  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "project-updates"
    rebase-strategy: "disabled"
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    patterns:
      - "*"
    cooldown:
      default-days: 3
